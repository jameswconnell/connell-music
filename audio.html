<style>
/* ── SPOTIFY-STYLE AUDIO PAGE ── */

body.sp-page {
  background: #121212;
  padding-bottom: 90px;
}

/* ── PLAYLIST HEADER ── */
.sp-header {
  padding: calc(68px + 48px) 48px 32px;
  background: linear-gradient(180deg, #2d1f06 0%, #1a1208 50%, #121212 100%);
  display: flex;
  align-items: flex-end;
  gap: 28px;
}

.sp-header-art {
  width: 192px;
  height: 192px;
  flex-shrink: 0;
  box-shadow: 0 8px 48px rgba(0,0,0,.7);
  overflow: hidden;
}

.sp-header-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sp-header-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sp-type {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #fff;
}

.sp-header-info h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(32px, 5.5vw, 76px);
  color: #fff;
  line-height: 1;
  letter-spacing: .04em;
  margin: 4px 0;
}

.sp-header-info p {
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  color: #b3b3b3;
  margin: 0;
}

.sp-meta {
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  color: #b3b3b3;
}

/* ── TRACK SECTION ── */
.sp-section {
  background: linear-gradient(180deg, #1a1208 0%, #121212 100px);
  padding: 0 32px 48px;
}

.sp-controls-row {
  display: flex;
  align-items: center;
  padding: 24px 16px 16px;
}

.sp-play-all {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #c9a84c;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(201,168,76,.4);
  transition: transform .1s, background .15s, box-shadow .15s;
}

.sp-play-all:hover {
  transform: scale(1.06);
  background: #d4b560;
  box-shadow: 0 6px 24px rgba(201,168,76,.5);
}

/* Track table header */
.sp-track-header {
  display: grid;
  grid-template-columns: 40px 1fr 52px;
  gap: 8px;
  padding: 6px 16px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  margin-bottom: 4px;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #b3b3b3;
}

.sp-track-header .col-dur {
  text-align: right;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}

/* Track rows */
.sp-tracklist {
  list-style: none;
  margin: 0;
  padding: 0;
}

.sp-track {
  display: grid;
  grid-template-columns: 40px 1fr 52px;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  align-items: center;
  transition: background .12s;
}

.sp-track:hover {
  background: rgba(255,255,255,.07);
}

.sp-track.is-active {
  background: rgba(201,168,76,.1);
}

/* Track number / equalizer */
.sp-track-num {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  color: #b3b3b3;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 20px;
}

.sp-track.is-active .sp-track-num .num-text {
  color: #c9a84c;
}

.eq-bars {
  display: none;
  gap: 2px;
  align-items: flex-end;
  height: 14px;
}

.eq-bars span {
  width: 3px;
  background: #c9a84c;
  border-radius: 1px;
  transform-origin: bottom;
}

.sp-track.is-active.is-playing .num-text { display: none; }
.sp-track.is-active.is-playing .eq-bars  { display: flex; }

.eq-bars span:nth-child(1) { height: 35%; animation: eq 0.9s ease-in-out infinite alternate; }
.eq-bars span:nth-child(2) { height: 80%; animation: eq 0.7s ease-in-out infinite alternate .15s; }
.eq-bars span:nth-child(3) { height: 55%; animation: eq 1.0s ease-in-out infinite alternate .3s; }

@keyframes eq {
  from { transform: scaleY(1); }
  to   { transform: scaleY(2.4); }
}

/* Track info */
.sp-track-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.sp-track-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color .12s;
}

.sp-track.is-active .sp-track-title {
  color: #c9a84c;
}

.sp-track-sub {
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  color: #b3b3b3;
}

.sp-track-dur {
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  color: #b3b3b3;
  text-align: right;
}

/* ── BOTTOM PLAYER BAR ── */
.sp-player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 90px;
  background: #181818;
  border-top: 1px solid #282828;
  display: grid;
  grid-template-columns: 1fr 2fr;
  align-items: center;
  padding: 0 16px;
  z-index: 1000;
}

/* Now playing info */
.sp-now-playing {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.sp-now-art {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  overflow: hidden;
}

.sp-now-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sp-now-text {
  min-width: 0;
}

.sp-now-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sp-now-sub {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  color: #b3b3b3;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Center controls */
.sp-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.sp-btn-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.sp-ctrl-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #b3b3b3;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  transition: color .15s;
  flex-shrink: 0;
}

.sp-ctrl-btn:hover { color: #fff; }

.sp-ctrl-btn.sp-play-pause {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #fff;
  color: #000;
  padding: 0;
  transition: transform .1s, background .15s;
}

.sp-ctrl-btn.sp-play-pause:hover {
  background: #e8e8e8;
  color: #000;
  transform: scale(1.05);
}

/* Progress row */
.sp-progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 480px;
}

.sp-time {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  color: #b3b3b3;
  min-width: 34px;
  text-align: center;
  tabular-nums: 1;
  font-variant-numeric: tabular-nums;
}

.sp-seek,
.sp-vol-range {
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  cursor: pointer;
  outline: none;
  transition: height .1s;
}

.sp-seek { flex: 1; }

.sp-seek:hover,
.sp-vol-range:hover { height: 5px; }

.sp-seek::-webkit-slider-thumb,
.sp-vol-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
}

.sp-seek:hover::-webkit-slider-thumb,
.sp-vol-range:hover::-webkit-slider-thumb { opacity: 1; }

/* Right: volume */
.sp-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.sp-vol-range { width: 90px; }

/* Responsive */
@media (max-width: 700px) {
  .sp-header {
    flex-direction: column;
    align-items: flex-start;
    padding: calc(68px + 24px) 24px 24px;
  }
  .sp-header-art { width: 140px; height: 140px; }
  .sp-section { padding: 0 16px 48px; }
  .sp-player-bar { grid-template-columns: 1fr 2fr; }
}
</style>

<script>
const DEFAULT_COVER     = 'assets/images/ClassicalTrioRecording.jpg';
const DEFAULT_COVER_MOB = 'assets/images/mobile/ClassicalTrioRecording.jpg';

const TRACKS = [
  { src:'assets/audio/AlleluiaMargaret.m4a',       title:'Mozart: "Alleluia"',             sub:'Soprano and Orchestra' },
  { src:'assets/audio/violin-piano.m4a',            title:'Mon cœur s\'ouvre à ta voix',    sub:'Violin & Piano',
    cover:'assets/images/CDcovers/aria-di-violino-desktop.jpg', coverMob:'assets/images/CDcovers/aria-di-violino-mobile.jpg' },
  { src:'assets/audio/AmandaCello.m4a',             title:'Cello & Piano',                  sub:'Chamber' },
  { src:'assets/audio/AppalacianSpring.m4a',        title:'Appalachian Spring',             sub:'Chamber Orchestra',
    cover:'assets/images/CDcovers/dco-desktop.jpg', coverMob:'assets/images/CDcovers/dco-mobile.jpg' },
  { src:'assets/audio/NoelWeSing.m4a',              title:'Noel We Sing',                   sub:'Voice Quartette & Organ' },
  { src:'assets/audio/DavidHiggsBachSinfonia29.m4a',title:'J.S. Bach, Sinfonia 29',        sub:'Pipe Organ' },
  { src:'assets/audio/WidorTocatta.m4a',            title:'Widor Toccata',                  sub:'Pipe Organ' },
  { src:'assets/audio/Rejoice.m4a',                 title:'Rejoice',                        sub:'Choir & Organ' },
  { src:'assets/audio/OMiaBambinoCaro.m4a',         title:'Puccini: "O mio babbino caro"', sub:'Soprano & Orchestra' },
  { src:'assets/audio/ODivine-Redeemer.m4a',        title:'O Divine Redeemer',              sub:'Soprano & Pipe Organ' },
];

const audio     = document.getElementById('audioEl');
const playBtn   = document.getElementById('playPauseBtn');
const playIcon  = playBtn.querySelector('.play-icon');
const pauseIcon = playBtn.querySelector('.pause-icon');
const seekBar   = document.getElementById('seekBar');
const curTime   = document.getElementById('curTime');
const totTime   = document.getElementById('totTime');
const nowTitle  = document.getElementById('nowTitle');
const nowSub    = document.getElementById('nowSub');
const listEl    = document.getElementById('trackList');
audio.volume = 1;

let current = 0;
const durations = new Array(TRACKS.length).fill(null);

function fmt(s) {
  if (!s || isNaN(s)) return '--:--';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function setFill(el, pct) {
  el.style.background = `linear-gradient(to right,#c9a84c ${pct}%,#383838 ${pct}%)`;
}

function renderList() {
  listEl.innerHTML = TRACKS.map((t, i) => `
    <li class="sp-track${i===current?' is-active':''}${i===current&&!audio.paused?' is-playing':''}" data-i="${i}">
      <div class="sp-track-num">
        <span class="num-text">${i+1}</span>
        <span class="eq-bars"><span></span><span></span><span></span></span>
      </div>
      <div class="sp-track-info">
        <span class="sp-track-title">${t.title}</span>
        <span class="sp-track-sub">${t.sub}</span>
      </div>
      <span class="sp-track-dur" id="dur${i}">${durations[i]?fmt(durations[i]):'--:--'}</span>
    </li>`).join('');
  listEl.querySelectorAll('.sp-track').forEach(row => {
    row.addEventListener('click', () => loadTrack(+row.dataset.i, true));
  });
}

const nowArt = document.getElementById('nowArt');

function loadTrack(i, play=false) {
  current = i;
  const t = TRACKS[i];
  audio.src = t.src;
  nowTitle.textContent = t.title;
  nowSub.textContent   = t.sub;
  // Swap album art if the track has its own cover
  const desk = t.cover    || DEFAULT_COVER;
  const mob  = t.coverMob || DEFAULT_COVER_MOB;
  nowArt.src    = desk;
  nowArt.srcset = `${mob} 320w, ${desk} 640w`;
  nowArt.alt    = t.title;
  renderList();
  if (play) audio.play();
}

function syncPlayState() {
  const playing = !audio.paused;
  playIcon.style.display  = playing ? 'none' : '';
  pauseIcon.style.display = playing ? '' : 'none';
  document.querySelectorAll('.sp-track').forEach((r,i) => {
    r.classList.toggle('is-playing', i===current && playing);
  });
}

audio.addEventListener('play',  syncPlayState);
audio.addEventListener('pause', syncPlayState);

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  seekBar.value = pct;
  setFill(seekBar, pct);
  curTime.textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  totTime.textContent = fmt(audio.duration);
  durations[current]  = audio.duration;
  const el = document.getElementById(`dur${current}`);
  if (el) el.textContent = fmt(audio.duration);
});

audio.addEventListener('ended', () => {
  if (current < TRACKS.length-1) loadTrack(current+1, true);
  else syncPlayState();
});

seekBar.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (seekBar.value/100) * audio.duration;
  setFill(seekBar, seekBar.value);
});


playBtn.addEventListener('click', () => {
  if (!audio.src) { loadTrack(0, true); return; }
  audio.paused ? audio.play() : audio.pause();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (current > 0) loadTrack(current-1, !audio.paused);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < TRACKS.length-1) loadTrack(current+1, !audio.paused);
});

document.getElementById('playAllBtn').addEventListener('click', () => loadTrack(0, true));

// Pre-fetch durations in the background
TRACKS.forEach((t, i) => {
  const tmp = new Audio();
  tmp.preload = 'metadata';
  tmp.addEventListener('loadedmetadata', () => {
    durations[i] = tmp.duration;
    const el = document.getElementById(`dur${i}`);
    if (el) el.textContent = fmt(tmp.duration);
  });
  tmp.src = t.src;
});

// Init
setFill(seekBar, 0);
renderList();
</script>
</body>
</html>
