<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found — Connell Music</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.not-found{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px;background:#0a0a0a}
.not-found-num{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(100px,20vw,200px);color:rgba(255,255,255,.06);line-height:1;letter-spacing:.04em;margin-bottom:-20px}
.not-found-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(28px,4vw,52px);color:#fff;letter-spacing:.06em;margin-bottom:20px}
.not-found-sub{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;color:rgba(255,255,255,.45);letter-spacing:.06em;margin-bottom:48px;line-height:1.7;max-width:400px}
.not-found-links{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.not-found-links a{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c9a84c;text-decoration:none;border-bottom:1px solid rgba(201,168,76,.3);padding-bottom:2px;transition:border-color .2s}
.not-found-links a:hover{border-color:#c9a84c}
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="/">Connell Music</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/the-team">The Team</a></li>
      <li><a href="/video">Video</a></li>
      <li><a href="/audio">Audio</a></li>
      <li><a href="/photos">Photos</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
    <button class="menu-btn" aria-label="Menu">Menu</button>
  </nav>
</header>

<main>
  <div class="not-found">
    <div class="not-found-num">404</div>
    <h1 class="not-found-title">Page Not Found</h1>
    <p class="not-found-sub">The page you're looking for doesn't exist or may have moved.</p>
    <nav class="not-found-links">
      <a href="/">Home</a>
      <a href="/video">Video</a>
      <a href="/audio">Audio</a>
      <a href="/the-team">The Team</a>
      <a href="/contact">Contact</a>
    </nav>
  </div>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>
